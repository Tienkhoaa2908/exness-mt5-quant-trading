name: v69-forward-quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  v69-forward-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python compile
        run: |
          python -m py_compile \
            scripts/build_v69_confirm_separation_retest_source.py \
            scripts/build_v69_frozen_forward_demo_source.py \
            scripts/analyze_v69_forward_trade_quality.py \
            tests/test_v69_confirm_separation_retest_static.py \
            tests/test_v69_frozen_forward_demo_static.py \
            tests/test_v69_forward_trade_quality.py \
            tests/test_v69_trade_quality_runtime_static.py \
            runtime/v69_frozen_forward_demo/PREPARE_V69_FROZEN_FORWARD_DEMO.py \
            runtime/v69_trade_quality_diagnostics/RUN_V69_TRADE_QUALITY_DIAGNOSTICS.py
      - name: Shell syntax
        run: |
          bash -n runtime/v69_frozen_forward_demo/START_V69_FROZEN_FORWARD_DEMO_GIT_BASH.sh
          bash -n runtime/v69_trade_quality_diagnostics/RUN_V69_TRADE_QUALITY_DIAGNOSTICS_GIT_BASH.sh
      - name: Frozen forward source tests
        run: python tests/test_v69_frozen_forward_demo_static.py
      - name: V69 parent regression tests
        run: python tests/test_v69_confirm_separation_retest_static.py
      - name: Trade-quality analyzer tests
        run: python tests/test_v69_forward_trade_quality.py
      - name: Trade-quality runtime isolation tests
        run: python tests/test_v69_trade_quality_runtime_static.py
      - name: Diagnostics read-only contract
        run: |
          grep -Fq 'MT5_DEMO_CAN_REMAIN_RUNNING=1' runtime/v69_trade_quality_diagnostics/RUN_V69_TRADE_QUALITY_DIAGNOSTICS.py
          grep -Fq 'development_only_not_independent' runtime/v69_trade_quality_diagnostics/RUN_V69_TRADE_QUALITY_DIAGNOSTICS.py
          ! grep -Fiq 'terminal64.exe' runtime/v69_trade_quality_diagnostics/RUN_V69_TRADE_QUALITY_DIAGNOSTICS.py
          ! grep -Fiq 'metaeditor64.exe' runtime/v69_trade_quality_diagnostics/RUN_V69_TRADE_QUALITY_DIAGNOSTICS.py
      - name: Diagnostics launcher contract
        run: |
          grep -Fq 'V69_TRADE_QUALITY_EXPECTED_HEAD is required' runtime/v69_trade_quality_diagnostics/RUN_V69_TRADE_QUALITY_DIAGNOSTICS_GIT_BASH.sh
          grep -Fq 'V31_PINNED_VENV' runtime/v69_trade_quality_diagnostics/RUN_V69_TRADE_QUALITY_DIAGNOSTICS_GIT_BASH.sh
          grep -Fq 'PYTHON_REJECTED=' runtime/v69_trade_quality_diagnostics/RUN_V69_TRADE_QUALITY_DIAGNOSTICS_GIT_BASH.sh
          grep -Fq 'no working Python 3.10+ found' runtime/v69_trade_quality_diagnostics/RUN_V69_TRADE_QUALITY_DIAGNOSTICS_GIT_BASH.sh
          ! grep -Fiq 'terminal64.exe' runtime/v69_trade_quality_diagnostics/RUN_V69_TRADE_QUALITY_DIAGNOSTICS_GIT_BASH.sh
          ! grep -Fiq 'metaeditor64.exe' runtime/v69_trade_quality_diagnostics/RUN_V69_TRADE_QUALITY_DIAGNOSTICS_GIT_BASH.sh
      - name: Preparation contract
        run: |
          grep -Fq 'V69_FORWARD_EXPECTED_HEAD is required' runtime/v69_frozen_forward_demo/PREPARE_V69_FROZEN_FORWARD_DEMO.py
          grep -Fq 'MetaTrader 5 must be closed during forward preparation' runtime/v69_frozen_forward_demo/PREPARE_V69_FROZEN_FORWARD_DEMO.py
          grep -Fq 'MetaEditor must be closed during forward preparation' runtime/v69_frozen_forward_demo/PREPARE_V69_FROZEN_FORWARD_DEMO.py
          grep -Fq '"real_money_authorized": False' runtime/v69_frozen_forward_demo/PREPARE_V69_FROZEN_FORWARD_DEMO.py
          grep -Fq '"short_enabled": False' runtime/v69_frozen_forward_demo/PREPARE_V69_FROZEN_FORWARD_DEMO.py
          grep -Fq 'DO NOT git clean' runtime/v69_frozen_forward_demo/START_V69_FROZEN_FORWARD_DEMO_GIT_BASH.sh
          grep -Fq 'DO NOT stash pop' runtime/v69_frozen_forward_demo/START_V69_FROZEN_FORWARD_DEMO_GIT_BASH.sh
      - name: Secret scan
        run: python scripts/secret_scan.py .
