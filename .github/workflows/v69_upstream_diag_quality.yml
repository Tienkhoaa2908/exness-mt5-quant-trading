name: v69-upstream-diag-quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  upstream-read-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python compile
        run: |
          python -m py_compile \
            scripts/analyze_v69_upstream_signal_funnel.py \
            scripts/analyze_v69_pre_pending_eval.py \
            scripts/analyze_v69_selector_coverage_recovery.py \
            scripts/analyze_v69_downstream_long_funnel.py \
            scripts/analyze_v69_cycle_economics_rearm.py \
            runtime/v69_real_readiness_probe/RUN_V69_UPSTREAM_SIGNAL_DIAG.py \
            runtime/v69_selector_coverage_recovery/RUN_V69_SELECTOR_COVERAGE_RECOVERY.py \
            runtime/v69_downstream_funnel_recovery/RUN_V69_DOWNSTREAM_FUNNEL_RECOVERY.py \
            runtime/v69_cycle_economics_recovery/RUN_V69_CYCLE_ECONOMICS_RECOVERY.py \
            tests/test_v69_upstream_signal_diag.py \
            tests/test_v69_selector_coverage_recovery.py \
            tests/test_v69_downstream_long_funnel.py \
            tests/test_v69_cycle_economics_rearm.py
      - name: Shell syntax
        run: |
          bash -n runtime/v69_real_readiness_probe/RUN_V69_UPSTREAM_SIGNAL_DIAG_GIT_BASH.sh
          bash -n runtime/v69_selector_coverage_recovery/RUN_V69_SELECTOR_COVERAGE_RECOVERY_GIT_BASH.sh
          bash -n runtime/v69_downstream_funnel_recovery/RUN_V69_DOWNSTREAM_FUNNEL_RECOVERY_GIT_BASH.sh
          bash -n runtime/v69_cycle_economics_recovery/RUN_V69_CYCLE_ECONOMICS_RECOVERY_GIT_BASH.sh
      - name: Upstream signal diagnostic tests
        run: python tests/test_v69_upstream_signal_diag.py
      - name: Selector coverage recovery tests
        run: python tests/test_v69_selector_coverage_recovery.py
      - name: Downstream LONG funnel recovery tests
        run: python tests/test_v69_downstream_long_funnel.py
      - name: Cycle economics and rearm tests
        run: python tests/test_v69_cycle_economics_rearm.py
      - name: Read-only safety contract
        run: |
          grep -Fq 'V69_UPSTREAM_MT5_CAN_REMAIN_RUNNING=1' runtime/v69_real_readiness_probe/RUN_V69_UPSTREAM_SIGNAL_DIAG.py
          grep -Fq 'V69_UPSTREAM_ORDERS_SENT=0' runtime/v69_real_readiness_probe/RUN_V69_UPSTREAM_SIGNAL_DIAG.py
          grep -Fq '_v69_forward_previous_*' runtime/v69_real_readiness_probe/RUN_V69_UPSTREAM_SIGNAL_DIAG.py
          grep -Fq 'V69_UPSTREAM_DIAG_EXPECTED_HEAD is required' runtime/v69_real_readiness_probe/RUN_V69_UPSTREAM_SIGNAL_DIAG_GIT_BASH.sh
          grep -Fq 'V64_ENTRY_EVAL.csv' scripts/analyze_v69_pre_pending_eval.py
          grep -Fq 'V69_SELECTOR_COVERAGE_MT5_CAN_REMAIN_RUNNING=1' runtime/v69_selector_coverage_recovery/RUN_V69_SELECTOR_COVERAGE_RECOVERY.py
          grep -Fq 'V69_SELECTOR_COVERAGE_ORDERS_SENT=0' runtime/v69_selector_coverage_recovery/RUN_V69_SELECTOR_COVERAGE_RECOVERY.py
          grep -Fq 'V69_SELECTOR_COVERAGE_EXPECTED_HEAD is required' runtime/v69_selector_coverage_recovery/RUN_V69_SELECTOR_COVERAGE_RECOVERY_GIT_BASH.sh
          grep -Fq 'V69_DOWNSTREAM_MT5_CAN_REMAIN_RUNNING=1' runtime/v69_downstream_funnel_recovery/RUN_V69_DOWNSTREAM_FUNNEL_RECOVERY.py
          grep -Fq 'V69_DOWNSTREAM_ORDERS_SENT=0' runtime/v69_downstream_funnel_recovery/RUN_V69_DOWNSTREAM_FUNNEL_RECOVERY.py
          grep -Fq 'V69_DOWNSTREAM_STRATEGY_CHANGED=0' runtime/v69_downstream_funnel_recovery/RUN_V69_DOWNSTREAM_FUNNEL_RECOVERY.py
          grep -Fq 'V69_DOWNSTREAM_FUNNEL_EXPECTED_HEAD is required' runtime/v69_downstream_funnel_recovery/RUN_V69_DOWNSTREAM_FUNNEL_RECOVERY_GIT_BASH.sh
          grep -Fq 'V69_CYCLE_ECONOMICS_MT5_CAN_REMAIN_RUNNING=1' runtime/v69_cycle_economics_recovery/RUN_V69_CYCLE_ECONOMICS_RECOVERY.py
          grep -Fq 'V69_CYCLE_ECONOMICS_ORDERS_SENT=0' runtime/v69_cycle_economics_recovery/RUN_V69_CYCLE_ECONOMICS_RECOVERY.py
          grep -Fq 'V69_CYCLE_ECONOMICS_STRATEGY_CHANGED=0' runtime/v69_cycle_economics_recovery/RUN_V69_CYCLE_ECONOMICS_RECOVERY.py
          grep -Fq 'V69_CYCLE_ECONOMICS_EXPECTED_HEAD is required' runtime/v69_cycle_economics_recovery/RUN_V69_CYCLE_ECONOMICS_RECOVERY_GIT_BASH.sh
          ! grep -Fiq 'terminal64.exe' runtime/v69_real_readiness_probe/RUN_V69_UPSTREAM_SIGNAL_DIAG.py
          ! grep -Fiq 'metaeditor64.exe' runtime/v69_real_readiness_probe/RUN_V69_UPSTREAM_SIGNAL_DIAG.py
          ! grep -Fiq 'OrderSend(' runtime/v69_real_readiness_probe/RUN_V69_UPSTREAM_SIGNAL_DIAG.py
          ! grep -Fiq '.Buy(' runtime/v69_real_readiness_probe/RUN_V69_UPSTREAM_SIGNAL_DIAG.py
          ! grep -Fiq '.Sell(' runtime/v69_real_readiness_probe/RUN_V69_UPSTREAM_SIGNAL_DIAG.py
          ! grep -Fiq 'terminal64.exe' runtime/v69_selector_coverage_recovery/RUN_V69_SELECTOR_COVERAGE_RECOVERY.py
          ! grep -Fiq 'metaeditor64.exe' runtime/v69_selector_coverage_recovery/RUN_V69_SELECTOR_COVERAGE_RECOVERY.py
          ! grep -Fiq 'OrderSend(' runtime/v69_selector_coverage_recovery/RUN_V69_SELECTOR_COVERAGE_RECOVERY.py
          ! grep -Fiq '.Buy(' runtime/v69_selector_coverage_recovery/RUN_V69_SELECTOR_COVERAGE_RECOVERY.py
          ! grep -Fiq '.Sell(' runtime/v69_selector_coverage_recovery/RUN_V69_SELECTOR_COVERAGE_RECOVERY.py
          ! grep -Fiq 'terminal64.exe' runtime/v69_downstream_funnel_recovery/RUN_V69_DOWNSTREAM_FUNNEL_RECOVERY.py
          ! grep -Fiq 'metaeditor64.exe' runtime/v69_downstream_funnel_recovery/RUN_V69_DOWNSTREAM_FUNNEL_RECOVERY.py
          ! grep -Fiq 'OrderSend(' runtime/v69_downstream_funnel_recovery/RUN_V69_DOWNSTREAM_FUNNEL_RECOVERY.py
          ! grep -Fiq '.Buy(' runtime/v69_downstream_funnel_recovery/RUN_V69_DOWNSTREAM_FUNNEL_RECOVERY.py
          ! grep -Fiq '.Sell(' runtime/v69_downstream_funnel_recovery/RUN_V69_DOWNSTREAM_FUNNEL_RECOVERY.py
          ! grep -Fiq 'terminal64.exe' runtime/v69_cycle_economics_recovery/RUN_V69_CYCLE_ECONOMICS_RECOVERY.py
          ! grep -Fiq 'metaeditor64.exe' runtime/v69_cycle_economics_recovery/RUN_V69_CYCLE_ECONOMICS_RECOVERY.py
          ! grep -Fiq 'OrderSend(' runtime/v69_cycle_economics_recovery/RUN_V69_CYCLE_ECONOMICS_RECOVERY.py
          ! grep -Fiq '.Buy(' runtime/v69_cycle_economics_recovery/RUN_V69_CYCLE_ECONOMICS_RECOVERY.py
          ! grep -Fiq '.Sell(' runtime/v69_cycle_economics_recovery/RUN_V69_CYCLE_ECONOMICS_RECOVERY.py
          ! grep -Fiq 'MetaTrader5' runtime/v69_cycle_economics_recovery/RUN_V69_CYCLE_ECONOMICS_RECOVERY.py
      - name: Secret scan
        run: python scripts/secret_scan.py .
