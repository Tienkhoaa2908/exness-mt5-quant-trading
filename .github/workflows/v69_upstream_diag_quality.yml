name: v69-upstream-diag-quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  upstream-read-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python compile
        run: |
          python -m py_compile \
            scripts/analyze_v69_upstream_signal_funnel.py \
            runtime/v69_real_readiness_probe/RUN_V69_UPSTREAM_SIGNAL_DIAG.py \
            tests/test_v69_upstream_signal_diag.py
      - name: Shell syntax
        run: bash -n runtime/v69_real_readiness_probe/RUN_V69_UPSTREAM_SIGNAL_DIAG_GIT_BASH.sh
      - name: Upstream signal diagnostic tests
        run: python tests/test_v69_upstream_signal_diag.py
      - name: Read-only safety contract
        run: |
          grep -Fq 'V69_UPSTREAM_MT5_CAN_REMAIN_RUNNING=1' runtime/v69_real_readiness_probe/RUN_V69_UPSTREAM_SIGNAL_DIAG.py
          grep -Fq 'V69_UPSTREAM_ORDERS_SENT=0' runtime/v69_real_readiness_probe/RUN_V69_UPSTREAM_SIGNAL_DIAG.py
          grep -Fq '_v69_forward_previous_*' runtime/v69_real_readiness_probe/RUN_V69_UPSTREAM_SIGNAL_DIAG.py
          grep -Fq 'V69_UPSTREAM_DIAG_EXPECTED_HEAD is required' runtime/v69_real_readiness_probe/RUN_V69_UPSTREAM_SIGNAL_DIAG_GIT_BASH.sh
          ! grep -Fiq 'terminal64.exe' runtime/v69_real_readiness_probe/RUN_V69_UPSTREAM_SIGNAL_DIAG.py
          ! grep -Fiq 'metaeditor64.exe' runtime/v69_real_readiness_probe/RUN_V69_UPSTREAM_SIGNAL_DIAG.py
          ! grep -Fiq 'OrderSend(' runtime/v69_real_readiness_probe/RUN_V69_UPSTREAM_SIGNAL_DIAG.py
          ! grep -Fiq '.Buy(' runtime/v69_real_readiness_probe/RUN_V69_UPSTREAM_SIGNAL_DIAG.py
          ! grep -Fiq '.Sell(' runtime/v69_real_readiness_probe/RUN_V69_UPSTREAM_SIGNAL_DIAG.py
      - name: Secret scan
        run: python scripts/secret_scan.py .
