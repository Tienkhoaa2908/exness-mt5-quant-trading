name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-safety-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy pandas
      - name: Python compile
        run: python -m compileall -q scripts tests runtime/v54_production_readiness
      - name: Active live-policy wording scan
        run: python scripts/check_live_policy_wording.py
      - name: Pytest
        run: python -m pytest -q
      - name: Secret and tracked-login scan
        run: python scripts/secret_scan.py .
      - name: Historical V29 archive quarantine assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("recovery/v29_adaptive_expert_lab_one_click.zip.b64")
          assert p.is_file(), p
          active = [
              Path("scripts/build_v54_production_readiness_source.py"),
              Path("runtime/v54_production_readiness/RUN_V54_PRODUCTION_READINESS.py"),
              Path("runtime/v54_production_readiness/PACKAGE_V54_EVIDENCE.py"),
          ]
          for f in active:
              if f.is_file():
                  assert "v29_adaptive_expert_lab_one_click.zip.b64" not in f.read_text(encoding="utf-8")
          print("V29_HISTORICAL_ARCHIVE=QUARANTINED_MIGRATION_INPUT")
          PY
