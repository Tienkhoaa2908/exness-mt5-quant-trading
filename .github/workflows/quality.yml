name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-safety-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Python compile
        run: python -m compileall -q scripts tests
      - name: Pytest
        run: python -m pytest -q
      - name: Secret and tracked-login scan
        run: python scripts/secret_scan.py .
      - name: Verify frozen V29.2 payload and build V29.3 distribution
        run: >-
          python scripts/verify_and_build_v29_release.py
          --archive recovery/v29_adaptive_expert_lab_one_click.zip.b64
          --output dist
      - name: Upload only verified V29.3 one-click artifact
        uses: actions/upload-artifact@v4
        with:
          name: mt5-quant-v29_3_distribution_hardening
          path: |
            dist/*.zip
            dist/*.sha256.txt
          if-no-files-found: error
