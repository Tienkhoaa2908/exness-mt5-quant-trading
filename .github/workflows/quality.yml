name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-safety-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest "numpy<3" "pandas<3" "scipy<2" "scikit-learn<2"
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
      - name: Python compile
        run: python -m compileall -q scripts tests runtime/v54_production_readiness runtime/v55_account_agnostic runtime/v56_weekly_live_replay runtime/v57_fixed001_trend_smc runtime/v58_fixed001_pullback_trend_cost runtime/v59_integrated_bidirectional_rr runtime/v60_small_loss_cash_target runtime/v61_profit_ratchet_m5_refinement runtime/v62_direction_isolated_entry_refinement runtime/v63_profit_quality_risk_zone runtime/v64_microstructure_trigger_shadow
      - name: V57 launcher shell syntax
        run: bash -n runtime/v57_fixed001_trend_smc/START_V57_FIXED001_TREND_SMC_GIT_BASH.sh
      - name: V58 launcher shell syntax
        run: bash -n runtime/v58_fixed001_pullback_trend_cost/START_V58_FIXED001_PULLBACK_TREND_COST_GIT_BASH.sh
      - name: V59 launcher shell syntax
        run: bash -n runtime/v59_integrated_bidirectional_rr/START_V59_INTEGRATED_BIDIRECTIONAL_RR_GIT_BASH.sh
      - name: V60 launcher shell syntax
        run: bash -n runtime/v60_small_loss_cash_target/START_V60_SMALL_LOSS_CASH_TARGET_GIT_BASH.sh
      - name: V61 launcher shell syntax
        run: bash -n runtime/v61_profit_ratchet_m5_refinement/START_V61_PROFIT_RATCHET_M5_REFINEMENT_GIT_BASH.sh
      - name: V61 fixed launcher shell syntax
        run: bash -n runtime/v61_profit_ratchet_m5_refinement/START_V61_PROFIT_RATCHET_M5_REFINEMENT_FIXED_GIT_BASH.sh
      - name: V62 launcher shell syntax
        run: bash -n runtime/v62_direction_isolated_entry_refinement/START_V62_DIRECTION_ISOLATED_ENTRY_REFINEMENT_GIT_BASH.sh
      - name: V63 launcher shell syntax
        run: bash -n runtime/v63_profit_quality_risk_zone/START_V63_PROFIT_QUALITY_RISK_ZONE_GIT_BASH.sh
      - name: V64 launcher shell syntax
        run: bash -n runtime/v64_microstructure_trigger_shadow/START_V64_MICROSTRUCTURE_TRIGGER_SHADOW_GIT_BASH.sh
      - name: Active live-policy wording scan
        run: python scripts/check_live_policy_wording.py
      - name: Pytest
        run: python -m pytest -q
      - name: Secret and tracked-login scan
        run: python scripts/secret_scan.py .
      - name: Historical V29 archive quarantine assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("recovery/v29_adaptive_expert_lab_one_click.zip.b64")
          assert p.is_file(), p
          active = [
              Path("scripts/build_v54_production_readiness_source.py"),
              Path("runtime/v54_production_readiness/RUN_V54_PRODUCTION_READINESS.py"),
              Path("runtime/v54_production_readiness/PACKAGE_V54_EVIDENCE.py"),
              Path("scripts/build_v55_account_agnostic_source.py"),
              Path("runtime/v55_account_agnostic/RUN_V55_ACCOUNT_AGNOSTIC.py"),
              Path("runtime/v55_account_agnostic/PACKAGE_V55_EVIDENCE.py"),
              Path("scripts/build_v56_weekly_live_replay_source.py"),
              Path("runtime/v56_weekly_live_replay/RUN_V56_WEEKLY_LIVE_REPLAY.py"),
              Path("scripts/build_v57_fixed001_trend_smc_source.py"),
              Path("runtime/v57_fixed001_trend_smc/RUN_V57_FIXED001_TREND_SMC.py"),
              Path("scripts/analyze_v57_fixed001_trend_smc.py"),
              Path("scripts/build_v58_fixed001_pullback_trend_cost_source.py"),
              Path("runtime/v58_fixed001_pullback_trend_cost/RUN_V58_FIXED001_PULLBACK_TREND_COST.py"),
              Path("scripts/analyze_v58_fixed001_pullback_trend_cost.py"),
              Path("scripts/build_v59_integrated_bidirectional_rr_source.py"),
              Path("scripts/build_v59_integrated_bidirectional_rr_screen_source.py"),
              Path("runtime/v59_integrated_bidirectional_rr/RUN_V59_INTEGRATED_BIDIRECTIONAL_RR.py"),
              Path("scripts/analyze_v59_integrated_bidirectional_rr.py"),
              Path("scripts/build_v60_small_loss_cash_target_source.py"),
              Path("scripts/build_v60_small_loss_cash_target_screen_source.py"),
              Path("runtime/v60_small_loss_cash_target/RUN_V60_SMALL_LOSS_CASH_TARGET.py"),
              Path("scripts/analyze_v60_small_loss_cash_target.py"),
              Path("scripts/build_v61_profit_ratchet_m5_refinement_source.py"),
              Path("scripts/build_v61_profit_ratchet_m5_refinement_screen_source.py"),
              Path("runtime/v61_profit_ratchet_m5_refinement/RUN_V61_PROFIT_RATCHET_M5_REFINEMENT.py"),
              Path("scripts/analyze_v61_profit_ratchet_m5_refinement.py"),
              Path("scripts/build_v61_profit_ratchet_m5_refinement_source_fixed.py"),
              Path("scripts/build_v61_profit_ratchet_m5_refinement_screen_source_fixed.py"),
              Path("runtime/v61_profit_ratchet_m5_refinement/RUN_V61_PROFIT_RATCHET_M5_REFINEMENT_FIXED.py"),
              Path("scripts/build_v62_direction_isolated_entry_refinement_source.py"),
              Path("scripts/analyze_v62_direction_isolated_entry_refinement.py"),
              Path("runtime/v62_direction_isolated_entry_refinement/RUN_V62_DIRECTION_ISOLATED_ENTRY_REFINEMENT.py"),
              Path("scripts/build_v63_profit_quality_risk_zone_source.py"),
              Path("scripts/build_v63_profit_quality_risk_zone_screen_source.py"),
              Path("scripts/analyze_v63_profit_quality_risk_zone.py"),
              Path("runtime/v63_profit_quality_risk_zone/RUN_V63_PROFIT_QUALITY_RISK_ZONE.py"),
              Path("scripts/build_v64_microstructure_trigger_shadow_source.py"),
              Path("scripts/build_v64_microstructure_trigger_shadow_source_fixed.py"),
              Path("scripts/build_v64_microstructure_trigger_shadow_screen_source.py"),
              Path("scripts/analyze_v64_microstructure_trigger_shadow.py"),
              Path("runtime/v64_microstructure_trigger_shadow/RUN_V64_MICROSTRUCTURE_TRIGGER_SHADOW.py"),
          ]
          for f in active:
              if f.is_file():
                  assert "v29_adaptive_expert_lab_one_click.zip.b64" not in f.read_text(encoding="utf-8")
          print("V29_HISTORICAL_ARCHIVE=QUARANTINED_MIGRATION_INPUT")
          PY
